services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dispatcher
      POSTGRES_USER: dispatcher
      POSTGRES_PASSWORD: dispatcher
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatcher -d dispatcher"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    image: go-webhook-dispatcher:local
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgresql://dispatcher:dispatcher@postgres:5432/dispatcher?sslmode=disable
      DATABASE_TIMEOUT: 5s
      READ_HEADER_TIMEOUT: 5s
      SHUTDOWN_TIMEOUT: 10s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  postgres_data:
